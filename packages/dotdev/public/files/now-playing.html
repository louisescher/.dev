<script>
/* ─── credentials ───────────────────────────────────────────────────────────
   Kept out of the URL on purpose, so the panel never writes them into a
   query string you might have on screen. ?user= and ?key= still override.
   Key: https://www.last.fm/api/account/create                              */
const CONFIG = {
  user: '',                    // Last.fm username
  key : '',                    // Last.fm API key
  art : '/api/status',         // endpoint supplying { image: "data:...", artists: "..." }
};

<style>
:root{
  --c0:#0A0F19; --c1:#ECE7E3; --c2:#123767; --c3:#F6A2C6; --c4:#1D69C9;
  --card:#0A0F19; --glow:16px; --gap:72px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1000px;height:320px;transform-origin:center;flex:none}
#stage > *{position:absolute;left:0;top:0}

#card{left:20px;top:20px;width:960px;height:280px;border-radius:28px;
  background:var(--card);box-shadow:0 0 12px rgba(0,0,0,.5)}
#clip{left:20px;top:20px;width:960px;height:280px;border-radius:28px;overflow:hidden}
#clip > *{position:absolute;left:0;top:0}

#fluid{width:960px;height:280px}
body.nofluid #fluid{display:none}

.art{margin:0;white-space:pre;transform-origin:0 0;
  font-family:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  letter-spacing:0}
#art-glow{filter:blur(var(--glow))}
body.noglow #art-glow{display:none}
body.nogrid .art{display:none}

#meta{left:320px;top:0;width:520px;height:280px;display:flex;flex-direction:column;
  justify-content:center;gap:13px;pointer-events:none}
#eyebrow{display:flex;align-items:center;gap:10px;
  font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500;font-size:14px;
  letter-spacing:.28em;text-transform:uppercase;color:var(--c3)}
#tick{width:9px;height:9px;background:var(--c3);flex:none;
  animation:blink 1.6s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
body.offline #tick{animation:none;opacity:.35}

/* marquee: marqy owns the loop. We only style the wrapper, the gap between
   copies, and the edge mask — everything else comes from marqy.css */
.scroll{overflow:hidden}
.scroll marqy-loop{display:block}
.scroll span{white-space:nowrap}
.scroll.run span{padding-right:var(--gap)}
.scroll.run{-webkit-mask-image:linear-gradient(90deg,
  transparent 0,#000 3%,#000 97%,transparent 100%)}

#title{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:700;font-size:46px;
  line-height:1.12;letter-spacing:-0.02em;color:#fff}
#artists{font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500;font-size:20px;
  line-height:1.3;letter-spacing:-0.01em;color:var(--c1);opacity:.72}

#progwrap{display:flex;align-items:center;gap:12px;margin-top:3px}
body.noprog #progwrap,body.offline #progwrap{display:none}
#prog{position:relative;flex:1;height:6px;background:rgba(0,0,0,.55)}
#progfill{position:absolute;left:0;top:0;height:100%;width:0;background:var(--c3)}
#times{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;
  color:var(--c1);opacity:.6;flex:none;letter-spacing:.04em}

body.nopoly #sym-poly{visibility:hidden}
@media (prefers-reduced-motion:reduce){ #tick{animation:none} }

#panel{position:fixed;top:10px;right:10px;z-index:9;display:flex;flex-direction:column;gap:6px;
  background:rgba(10,15,25,.88);border:1px solid #2a3550;border-radius:8px;padding:10px 12px;
  font:12px/1.4 ui-monospace,monospace;color:#cdd6e4;min-width:236px;
  max-height:calc(100vh - 20px);overflow:auto}
#panel label{display:flex;align-items:center;gap:10px;justify-content:space-between;cursor:pointer}
#panel input[type=number]{width:62px;background:#0a0f19;color:#ece7e3;border:1px solid #2a3550;
  border-radius:4px;padding:2px 6px;font:inherit}
#panel select{background:#0a0f19;color:#ece7e3;border:1px solid #2a3550;border-radius:4px;font:inherit}
#panel hr{border:0;border-top:1px solid #2a3550;margin:4px 0;width:100%}
#panel small{color:#5c6a85}
#panel b{color:#5c6a85;font-weight:400;letter-spacing:.14em;text-transform:uppercase;font-size:10px}
body.nopanel #panel{display:none}

<script>
const ui = id => document.getElementById(id);
const Q  = new URLSearchParams(location.search);
const qb = (k,cur) => Q.has(k) ? Q.get(k)!=='0' : cur;
const qn = (k,cur,lo,hi) => Q.has(k) ? Math.min(hi,Math.max(lo, parseFloat(Q.get(k))||cur)) : cur;

const USER = Q.get('user') || CONFIG.user;
const KEY  = Q.get('key')  || CONFIG.key;
const ART  = Q.get('art')  || CONFIG.art;

/* ─── settings ───────────────────────────────────────────────────────────── */
const FILLS = ['fluid','bands','flat'];
const S = {
  poll : qn('poll',5,2,60),
  prog : qb('prog',true),
  speed: qn('speed',1,0.1,5),
  gap  : qn('gap',72,0,400),
  tsize: qn('tsize',46,20,64),
  grid : qb('grid',true),
  ramp : ['disc','dense','blocks','half'].indexOf(Q.get('ramp'))>=0 ? Q.get('ramp') : 'disc',
  size : qn('size',240,120,256),
  cols : Math.round(qn('cols',72,8,200)),
  rows : Math.round(qn('rows',48,6,160)),
  fs   : qn('fs',5,3,18),
  gam  : qn('gam',1,0.2,3),
  con  : qn('con',1.15,0.2,3),
  sat  : qn('sat',1.2,0,3),
  lev  : Math.round(qn('lev',6,2,32)),
  inv  : qb('inv',false),
  glow : qb('glow',true),
  gpx  : qn('gpx',16,0,40),
  pal  : qb('pal',true),
  fill : FILLS.indexOf(Q.get('fill'))>=0 ? Q.get('fill') : 'fluid',
  dark : qn('dark',30,0,100),
  flow : qn('flow',100,0,300),
  po   : qb('po',true),
  phs  : qn('phs',0,-30000,30000),
  panel: qb('panel',false),
};
const DEFAULTS = { poll:5, prog:1, speed:1, gap:72, tsize:46, grid:1, ramp:'disc', size:240,
  cols:72, rows:48, fs:5, gam:1, con:1.15, sat:1.2, lev:6, inv:0, glow:1, gpx:16,
  pal:1, fill:'fluid', dark:30, flow:100, po:1, phs:0, panel:0 };

function syncURL(){
  const p = new URLSearchParams();
  if (Q.get('user')) p.set('user', Q.get('user'));
  if (Q.get('key'))  p.set('key',  Q.get('key'));
  if (Q.get('art'))  p.set('art',  Q.get('art'));
  for (const k in DEFAULTS){
    let v = S[k];
    if (typeof v === 'boolean') v = v ? 1 : 0;
    if (String(v) !== String(DEFAULTS[k])) p.set(k, v);
  }
  const qs = p.toString();
  try{ history.replaceState(null,'', qs ? '?'+qs : location.pathname); }catch(e){}
}

/* ─── ramps ──────────────────────────────────────────────────────────────── */
const RAMPS = {
  /* built from the disc's own DEMOTE/PROMOTE density chains */
  disc  : " `.,:;!jz7tfsukhRDWQ@#",
  dense : ' .\'`^",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$',
  blocks: " \u2591\u2592\u2593\u2588",
};

/* ─── character grid ─────────────────────────────────────────────────────── */
const main = ui('art-main'), glow = ui('art-glow');
const esc = c => c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c;

function shape(r,g,b){
  const gray = 0.299*r + 0.587*g + 0.114*b;
  r = gray + (r-gray)*S.sat; g = gray + (g-gray)*S.sat; b = gray + (b-gray)*S.sat;
  const step = 255 / (S.lev - 1);
  const q = v => {
    let n = Math.pow(Math.max(0, Math.min(1, v/255)), S.gam);
    n = (n - 0.5) * S.con + 0.5;
    n = Math.max(0, Math.min(1, n));
    return Math.round(Math.round(n*255 / step) * step);
  };
  return [q(r), q(g), q(b)];
}
const lumOf = (r,g,b) => (0.299*r + 0.587*g + 0.114*b) / 255;

const cv  = document.createElement('canvas');
const cvx = cv.getContext('2d', { willReadFrequently:true });
let curImg = null;

/* The grid is laid out at natural font metrics and then scaled to the block.
   Nothing here depends on knowing the glyph advance up front, so a webfont
   arriving late can't leave the whole thing squashed. */
function fitArt(){
  main.style.transform = 'none'; glow.style.transform = 'none';
  const w = main.scrollWidth, h = main.scrollHeight;
  const t = (w > 0 && h > 0)
    ? 'scale(' + (S.size/w).toFixed(5) + ',' + (S.size/h).toFixed(5) + ')'
    : 'none';
  main.style.transform = t; glow.style.transform = t;
  const top = Math.round((280 - S.size) / 2);
  main.style.top = top + 'px'; glow.style.top = top + 'px';
}

function setMetrics(){
  for (const el of [main, glow]){
    el.style.fontSize   = S.fs + 'px';
    el.style.lineHeight = S.fs + 'px';
  }
  document.documentElement.style.setProperty('--glow', S.gpx + 'px');
}

function renderGrid(){
  if (!curImg){ main.innerHTML = ''; glow.innerHTML = ''; return; }
  const half = S.ramp === 'half';
  const cols = S.cols, rows = S.rows, sh = half ? rows*2 : rows;

  cv.width = cols; cv.height = sh;
  cvx.clearRect(0,0,cols,sh);
  cvx.drawImage(curImg, 0, 0, cols, sh);
  const px = cvx.getImageData(0,0,cols,sh).data;

  const ramp = RAMPS[S.ramp] || RAMPS.disc;
  const N = ramp.length - 1;
  const lines = [];

  for (let y=0; y<rows; y++){
    let out='', run='', style=null;
    const flush = () => { if(run){ out += style ? '<span style="'+style+'">'+run+'</span>' : run; run=''; } };
    for (let x=0; x<cols; x++){
      let st, chr;
      if (half){
        const a = ((y*2)*cols + x)*4, b = ((y*2+1)*cols + x)*4;
        const t = shape(px[a],px[a+1],px[a+2]), u = shape(px[b],px[b+1],px[b+2]);
        chr = '\u2580';
        st  = 'color:rgb('+t+');background:rgb('+u+')';
      } else {
        const i = (y*cols + x)*4;
        const c = shape(px[i],px[i+1],px[i+2]);
        let f = lumOf(c[0],c[1],c[2]);
        if (S.inv) f = 1 - f;
        chr = ramp[Math.min(N, Math.max(0, Math.round(f*N)))];
        st  = chr===' ' ? null : 'color:rgb('+c+')';
      }
      if (st !== style){ flush(); style = st; }
      run += esc(chr);
    }
    flush(); lines.push(out);
  }
  const html = lines.join('\n');            /* no trailing newline: it would add a row */
  main.innerHTML = html; glow.innerHTML = html;
  fitArt();
}

/* ─── palette ────────────────────────────────────────────────────────────── */
function toHsl(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2;
  if (mx===mn) return [0,0,l];
  const d=mx-mn, s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
  let h;
  if (mx===r) h=((g-b)/d + (g<b?6:0))/6;
  else if (mx===g) h=((b-r)/d + 2)/6;
  else h=((r-g)/d + 4)/6;
  return [h,s,l];
}
function toRgb(h,s,l){
  const f = n => {
    const k=(n+h*12)%12, a=s*Math.min(l,1-l);
    const v=l - a*Math.max(-1, Math.min(k-3, Math.min(9-k, 1)));
    return Math.round(Math.max(0,Math.min(1,v))*255);
  };
  return [f(0), f(8), f(4)];
}
const hex = (h,s,l) => '#' + toRgb(h,s,l).map(v=>v.toString(16).padStart(2,'0')).join('');

const BASE = [ {h:.617,s:.43,l:.07}, {h:.588,s:.70,l:.24},
               {h:.588,s:.75,l:.45}, {h:.925,s:.81,l:.80}, {h:.05,s:.19,l:.91} ];
let PAL = BASE.slice();     /* five stops, dark to light */

function extract(px){
  const bins = new Map();
  for (let i=0; i<px.length; i+=4){
    if (px[i+3] < 128) continue;
    const key = (px[i]>>4)+','+(px[i+1]>>4)+','+(px[i+2]>>4);
    const e = bins.get(key) || {n:0,r:0,g:0,b:0};
    e.n++; e.r+=px[i]; e.g+=px[i+1]; e.b+=px[i+2]; bins.set(key,e);
  }
  const cand = [];
  bins.forEach(e=>{
    const c = toHsl(e.r/e.n, e.g/e.n, e.b/e.n);
    cand.push({ h:c[0], s:c[1], l:c[2],
      score: e.n * (0.35 + c[1]) * (c[2]>0.04 && c[2]<0.97 ? 1 : 0.15) });
  });
  cand.sort((a,b)=>b.score-a.score);

  const picked = [];
  for (let i=0; i<cand.length && picked.length<5; i++){
    const c = cand[i];
    const clash = picked.some(p=>{
      let dh = Math.abs(p.h-c.h); dh = Math.min(dh, 1-dh);
      return dh < 0.06 && Math.abs(p.l-c.l) < 0.14;
    });
    if (!clash) picked.push(c);
  }
  while (picked.length < 5) picked.push(picked[picked.length-1] || BASE[2]);

  picked.sort((a,b)=>a.l-b.l);
  const clamp = (v,lo,hi) => Math.min(hi, Math.max(lo, v));
  return picked.map((c,i)=>{
    let s=c.s, l=c.l;
    if (i===0){ l=Math.min(l,0.10); s=Math.min(s,0.55); }
    if (i===1){ l=clamp(l,0.16,0.34); }
    if (i===2){ l=clamp(l,0.38,0.56); s=Math.max(s,0.35); }
    if (i===3){ l=clamp(l,0.62,0.82); }
    if (i===4){ l=Math.max(l,0.90); s=Math.min(s,0.22); }
    return {h:c.h, s:s, l:l};
  });
}

const dimOf = c => ({ h:c.h, s:Math.min(c.s,0.62), l:c.l * (S.dark/100) });

function applyPalette(){
  const p = S.pal ? PAL : BASE;
  const r = document.documentElement.style;
  /* ramp runs dark -> light, laid into c0 c2 c4 c3 c1 as the gradient walks it */
  ['c0','c2','c4','c3','c1'].forEach((slot,i)=> r.setProperty('--'+slot, hex(p[i].h,p[i].s,p[i].l)));

  const d = p.map(dimOf);
  if (S.fill === 'bands'){
    r.setProperty('--card',
      'linear-gradient(45deg,' +
      hex(d[0].h,d[0].s,d[0].l) + ' 0 8.5%,'    + hex(d[1].h,d[1].s,d[1].l) + ' 8.5% 27.5%,' +
      hex(d[2].h,d[2].s,d[2].l) + ' 27.5% 49%,' + hex(d[3].h,d[3].s,d[3].l) + ' 49% 72%,'    +
      hex(d[4].h,d[4].s,d[4].l) + ' 72% 100%)');
  } else {
    r.setProperty('--card', hex(d[0].h,d[0].s,d[0].l));
  }
  document.body.classList.toggle('nofluid', S.fill !== 'fluid');
  retintFluid();
}

/* ─── fluid background ───────────────────────────────────────────────────── */
/* Same sim as the BRB screen: roaming vortices advect a diagonal ramp, with
   wandering injectors bleeding colour back in. Stops come from the cover. */
const FLW = 160, FLH = 48, NPX = FLW*FLH;
const fcv = ui('fluid'), fx = fcv.getContext('2d');
const small = document.createElement('canvas'); small.width = FLW; small.height = FLH;
const sctx  = small.getContext('2d');
const idata = sctx.createImageData(FLW, FLH);
const EDGE  = new Float32Array(NPX);
let F = new Float32Array(NPX*3), G = new Float32Array(NPX*3);
let BASEF = new Float32Array(NPX*3);
let INJ = [], retint = 0, fluidGate = false;

for (let y=0;y<FLH;y++) for (let x=0;x<FLW;x++){
  EDGE[y*FLW+x] = Math.min(Math.min(x, FLW-1-x)/12, Math.min(y, FLH-1-y)/9, 1);
}

function buildBase(hard){
  const p = (S.pal ? PAL : BASE).map(dimOf).map(c=>toRgb(c.h,c.s,c.l));
  const AT = [0.085, 0.275, 0.49, 0.72, 0.895];
  for (let y=0;y<FLH;y++) for (let x=0;x<FLW;x++){
    const i = y*FLW+x;
    const d = Math.min(Math.max((x/FLW + (1 - y/FLH))/2, 0), 1);
    let c = p[0];
    if (d >= AT[4]) c = p[4];
    else for (let k=0;k<4;k++){
      if (d >= AT[k] && d <= AT[k+1]){
        const f = (d-AT[k])/(AT[k+1]-AT[k]);
        c = [ p[k][0]*(1-f)+p[k+1][0]*f, p[k][1]*(1-f)+p[k+1][1]*f, p[k][2]*(1-f)+p[k+1][2]*f ];
      }
    }
    BASEF[i*3]=c[0]; BASEF[i*3+1]=c[1]; BASEF[i*3+2]=c[2];
    if (hard){ F[i*3]=c[0]; F[i*3+1]=c[1]; F[i*3+2]=c[2]; }
  }
  const R = FLW/192;
  INJ = [                                   /* colour, speed, phase, radius, alpha */
    [p[0], 0.000031, 0.0, 40*R, .010], [p[0], 0.000023, 2.1, 44*R, .009],
    [p[1], 0.000027, 4.0, 36*R, .008], [p[2], 0.000021, 1.2, 36*R, .008],
    [p[3], 0.000035, 3.3, 32*R, .007], [p[4], 0.000041, 5.1, 24*R, .006],
  ];
}
function retintFluid(){ buildBase(false); retint = 110; }   /* bleed to the new stops */

function fluidTick(t){
  if (S.fill !== 'fluid') return;
  fluidGate = !fluidGate; if (fluidGate) return;            /* 30fps is plenty */

  if (retint > 0){
    retint--;
    const f = 0.05;
    for (let i=0;i<NPX*3;i++) F[i] += (BASEF[i]-F[i])*f;
  }

  const w = t * 0.00010 * (S.flow/100);
  const CX = FLW/2, CY = FLH/2;
  const vor = [
    [CX+0.42*FLW*Math.sin(w),        CY+0.35*FLH*Math.cos(w*1.31),   0.208*FLW,  3.2],
    [CX+0.42*FLW*Math.cos(w*0.77),   CY+0.35*FLH*Math.sin(w*1.09),   0.240*FLW, -3.4],
    [CX+0.33*FLW*Math.sin(w*0.53+2), CY+0.28*FLH*Math.cos(w*0.87+1), 0.177*FLW,  2.7],
  ];

  for (let y=0;y<FLH;y++) for (let x=0;x<FLW;x++){
    const i = y*FLW+x;
    let vx=0, vy=0;
    for (let n=0;n<3;n++){
      const dx = x-vor[n][0], dy = y-vor[n][1], R = vor[n][2];
      const k = vor[n][3]*Math.exp(-(dx*dx+dy*dy)/(R*R))*0.05;
      vx += -dy*k; vy += dx*k;
    }
    let px = x - vx*EDGE[i], py = y - vy*EDGE[i];
    px = Math.min(Math.max(px,0), FLW-1.001); py = Math.min(Math.max(py,0), FLH-1.001);
    const x0=px|0, y0=py|0, fxr=px-x0, fyr=py-y0;
    const i00=(y0*FLW+x0)*3, i10=i00+3, i01=i00+FLW*3, i11=i01+3;
    for (let ch=0;ch<3;ch++){
      G[i*3+ch] = F[i00+ch]*(1-fxr)*(1-fyr) + F[i10+ch]*fxr*(1-fyr) +
                  F[i01+ch]*(1-fxr)*fyr     + F[i11+ch]*fxr*fyr;
    }
  }
  const tmp = F; F = G; G = tmp;

  for (let n=0;n<INJ.length;n++){
    const c=INJ[n][0], sp=INJ[n][1], ph=INJ[n][2], R=INJ[n][3], al=INJ[n][4];
    const cx = FLW/2 + (0.44*FLW - 0.03*FLW*n)*Math.sin(t*sp*6.28+ph);
    const cy = FLH/2 + (0.37*FLH - 0.03*FLH*n)*Math.cos(t*sp*6.28*1.27+ph*1.7);
    const x0=Math.max(0,(cx-2.2*R)|0), x1=Math.min(FLW-1,(cx+2.2*R)|0);
    const y0=Math.max(0,(cy-2.2*R)|0), y1=Math.min(FLH-1,(cy+2.2*R)|0);
    for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
      const dx=x-cx, dy=y-cy;
      const gq=Math.exp(-(dx*dx+dy*dy)/(R*R))*al, i3=(y*FLW+x)*3;
      F[i3]  =F[i3]  *(1-gq)+c[0]*gq;
      F[i3+1]=F[i3+1]*(1-gq)+c[1]*gq;
      F[i3+2]=F[i3+2]*(1-gq)+c[2]*gq;
    }
  }

  const D = idata.data;
  for (let i=0;i<NPX;i++){
    let r=F[i*3], g=F[i*3+1], b=F[i*3+2];
    const gray = 0.299*r + 0.587*g + 0.114*b;              /* saturate(1.06) */
    r = gray+(r-gray)*1.06; g = gray+(g-gray)*1.06; b = gray+(b-gray)*1.06;
    D[i*4]   = (r-128)*1.12+128;                           /* contrast(1.12) */
    D[i*4+1] = (g-128)*1.12+128;
    D[i*4+2] = (b-128)*1.12+128;
    D[i*4+3] = 255;
  }
  sctx.putImageData(idata,0,0);
  fx.imageSmoothingEnabled = true; fx.imageSmoothingQuality = 'high';
  fx.drawImage(small, 0, 0, 960, 280);
}

/* ─── marquee (marqy) ────────────────────────────────────────────────────── */
/* getBoundingClientRect reports post-transform pixels and #stage is scaled,
   so every measurement is divided back out to design units. */
let stageScale = 1;
const widthOf = el => el.getBoundingClientRect().width / stageScale;

/* marqy repeats its children to fill the track, so a line that already fits
   would render as duplicates. Only wrap the ones that actually overflow. */
function marquee(box){
  const text = box.dataset.text || '';
  box.innerHTML = '';
  box.classList.remove('run');

  const span = document.createElement('span');
  span.textContent = text;
  box.appendChild(span);
  if (widthOf(span) <= widthOf(box) + 1) return;      /* it fits: leave it still */

  box.removeChild(span);
  const loop = document.createElement('marqy-loop');
  loop.setAttribute('speed', S.speed);
  loop.setAttribute('direction', 'left');
  loop.appendChild(span);
  box.appendChild(loop);
  box.classList.add('run');
}

function setText(box, text){
  if (box.dataset.text === text) return;              /* don't restart an unchanged line */
  box.dataset.text = text;
  marquee(box);
}

function remeasure(){
  ui('title').style.fontSize = S.tsize + 'px';
  document.documentElement.style.setProperty('--gap', S.gap + 'px');
  marquee(ui('title')); marquee(ui('artists'));
}

/* ─── Last.fm ────────────────────────────────────────────────────────────── */
const LFM = 'https://ws.audioscrobbler.com/2.0/?format=json&api_key=' + encodeURIComponent(KEY);
const recentURL = () => LFM + '&method=user.getrecenttracks&limit=1&user=' + encodeURIComponent(USER);
const infoURL = (a,t) => LFM + '&method=track.getInfo&autocorrect=1&artist=' +
  encodeURIComponent(a) + '&track=' + encodeURIComponent(t);

let trackKey = null, startedAt = 0, duration = 0, imgSrc = null, catchup = null;

const mmss = ms => {
  const s = Math.max(0, Math.round(ms/1000));
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
};

function loadImage(src){
  return new Promise(res=>{
    const img = new Image();
    img.onload = ()=>{
      curImg = img;
      if (S.pal){
        const c = document.createElement('canvas'); c.width = c.height = 40;
        const g = c.getContext('2d', { willReadFrequently:true });
        g.drawImage(img, 0, 0, 40, 40);
        PAL = extract(g.getImageData(0,0,40,40).data);
      }
      applyPalette(); renderGrid(); res(true);
    };
    img.onerror = ()=>res(false);
    img.src = src;                     /* data: URI — same origin, canvas stays clean */
  });
}

async function fetchArt(){
  if (!ART) return;
  try{
    const d = await (await fetch(ART, {cache:'no-store'})).json();
    if (d.artists) setText(ui('artists'), d.artists);
    if (d.image && d.image !== imgSrc){ imgSrc = d.image; await loadImage(d.image); }
  }catch(e){}
}

async function fetchDuration(artist, track){
  duration = 0;
  try{
    const d = await (await fetch(infoURL(artist, track), {cache:'no-store'})).json();
    duration = parseInt(d && d.track && d.track.duration, 10) || 0;
  }catch(e){}
}

async function poll(){
  if (!USER || !KEY){
    ui('label').textContent = 'Setup';
    setText(ui('title'), 'Add a Last.fm user and key');
    setText(ui('artists'), 'top of this file, or ?user= &key=');
    document.body.classList.add('offline');
    return;
  }
  try{
    const d = await (await fetch(recentURL(), {cache:'no-store'})).json();
    const t = d && d.recenttracks && d.recenttracks.track && d.recenttracks.track[0];
    const live = !!(t && t['@attr'] && t['@attr'].nowplaying === 'true');

    document.body.classList.toggle('offline', !live);
    if (!live){
      if (trackKey !== 'off'){
        trackKey = 'off'; duration = 0;
        ui('label').textContent = 'Offline';
        setText(ui('title'), 'Nothing playing');
        setText(ui('artists'), '');
      }
      return;
    }

    const artist = t.artist['#text'] || t.artist.name || '';
    const key = artist + '|' + t.name;
    if (key === trackKey) return;

    trackKey  = key;
    startedAt = Date.now();
    ui('label').textContent = 'Now playing';
    setText(ui('title'), t.name);
    setText(ui('artists'), artist);

    fetchDuration(artist, t.name);
    fetchArt();
    clearTimeout(catchup);
    catchup = setTimeout(fetchArt, 6000);   /* the art endpoint often lags a change */
  }catch(e){ /* blip: hold the last good state */ }
}

/* ─── icosahedron: ambient tumble, same clock as the BRB screen ──────────── */
const ICO = (function(){
  const P=(1+Math.sqrt(5))/2, raw=[];
  for (const a of [1,-1]) for (const b of [1,-1]){
    raw.push([0,a,b*P]); raw.push([a,b*P,0]); raw.push([b*P,0,a]);
  }
  const n = Math.hypot(1,P);
  const V = raw.map(p=>p.map(c=>c/n));
  const dist=(i,j)=>Math.hypot(V[i][0]-V[j][0],V[i][1]-V[j][1],V[i][2]-V[j][2]);
  let dmin=1e9;
  for (let i=0;i<12;i++) for (let j=i+1;j<12;j++) dmin=Math.min(dmin,dist(i,j));
  const E=[];
  for (let i=0;i<12;i++) for (let j=i+1;j<12;j++) if (dist(i,j)<dmin*1.01) E.push([i,j]);
  return {V:V, E:E};
})();

const polyG = ui('sym-poly');
const polyLines = ICO.E.map(function(){
  const l = document.createElementNS('http://www.w3.org/2000/svg','line');
  polyG.appendChild(l); return l;
});
const PCX = 888, PCY = 210, PR = 30;

function amb(t){
  const a=t*2*Math.PI/26000, b=t*2*Math.PI/17000;
  const ca=Math.cos(a), sa=Math.sin(a), cb=Math.cos(b), sb=Math.sin(b);
  return [cb,0,sb, sa*sb,ca,-sa*cb, -ca*sb,sa,ca*cb];   /* Rx(a)Ry(b) */
}
const ap = (M,v)=>[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],
                   M[3]*v[0]+M[4]*v[1]+M[5]*v[2],
                   M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];

function drawPoly(t){
  const M = amb(t + S.phs);
  const pts = ICO.V.map(function(v){ const p=ap(M,v); return [PCX+PR*p[0], PCY+PR*p[1], p[2]]; });
  for (let k=0;k<ICO.E.length;k++){
    const e=ICO.E[k], p=pts[e[0]], q=pts[e[1]], l=polyLines[k];
    l.setAttribute('x1',p[0].toFixed(2)); l.setAttribute('y1',p[1].toFixed(2));
    l.setAttribute('x2',q[0].toFixed(2)); l.setAttribute('y2',q[1].toFixed(2));
    l.setAttribute('stroke-opacity',(0.42+0.58*((p[2]+q[2])/4+0.5)).toFixed(3));
  }
}

/* ─── loop ───────────────────────────────────────────────────────────────── */
let epoch = null;
function loop(t){
  requestAnimationFrame(loop);      /* schedule first: one bad frame can't kill the chain */
  try{
    if (epoch === null) epoch = t;
    const pt = t - epoch;
    if (S.po) drawPoly(pt);
    fluidTick(pt);

    if (S.prog){
      if (duration > 0 && !document.body.classList.contains('offline')){
        const el = Math.min(Date.now() - startedAt, duration);
        ui('progfill').style.width = (el / duration * 100).toFixed(2) + '%';
        ui('times').textContent = mmss(el) + ' / ' + mmss(duration);
      } else {
        ui('progfill').style.width = '0%';
        ui('times').textContent = '0:00 / --:--';
      }
    }
  }catch(e){}
}

/* ─── panel wiring ───────────────────────────────────────────────────────── */
function applyFlags(){
  document.body.classList.toggle('nogrid', !S.grid);
  document.body.classList.toggle('noglow', !S.glow);
  document.body.classList.toggle('noprog', !S.prog);
  document.body.classList.toggle('nopoly', !S.po);
  document.body.classList.toggle('nofluid', S.fill !== 'fluid');
  document.body.classList.toggle('nopanel', !S.panel);
}

const NUMS  = ['poll','speed','gap','tsize','size','cols','rows','fs','gam','con','sat','lev','gpx','dark','flow','phs'];
const BOOLS = { prog:'prog_', grid:'grid', inv:'inv', glow:'glow', pal:'pal', po:'po' };
const SELS  = ['ramp','fill'];
const ARTKEYS = ['size','cols','rows','fs','ramp','gam','con','sat','lev','inv','gpx'];
const TEXTKEYS = ['speed','gap','tsize'];

function reflect(){
  NUMS.forEach(k=>{ ui(k).value = S[k]; });
  for (const k in BOOLS) ui(BOOLS[k]).checked = S[k];
  SELS.forEach(k=>{ ui(k).value = S[k]; });
}

function changed(k){
  if (ARTKEYS.indexOf(k) >= 0){ setMetrics(); renderGrid(); }
  if (TEXTKEYS.indexOf(k) >= 0) remeasure();
  if (['pal','fill','dark'].indexOf(k) >= 0) applyPalette();
  if (k === 'poll') restart();
  applyFlags(); syncURL();
}

NUMS.forEach(function(k){
  ui(k).addEventListener('input', function(e){
    const v = parseFloat(e.target.value);
    if (!isNaN(v)){ S[k] = (k==='cols'||k==='rows'||k==='lev') ? Math.round(v) : v; changed(k); }
  });
});
for (const k in BOOLS){
  (function(k){
    ui(BOOLS[k]).addEventListener('change', function(e){ S[k] = e.target.checked; changed(k); });
  })(k);
}
SELS.forEach(function(k){
  ui(k).addEventListener('change', function(e){ S[k] = e.target.value; changed(k); });
});
addEventListener('keydown', function(e){
  if (e.key==='h' || e.key==='H'){ S.panel = !S.panel; applyFlags(); syncURL(); }
});

/* ─── stage fit + OBS lifecycle ──────────────────────────────────────────── */
const stage = ui('stage');
function fit(){
  stageScale = Math.min(innerWidth/1000, innerHeight/320);
  stage.style.transform = 'scale(' + stageScale + ')';
}
addEventListener('resize', function(){ fit(); remeasure(); }); fit();

let timer = null;
function restart(){ clearInterval(timer); timer = setInterval(poll, S.poll*1000); }
function refresh(){ trackKey = null; imgSrc = null; epoch = null; poll(); restart(); }

addEventListener('obsSourceVisibleChanged', function(e){ if(!e||!e.detail||e.detail.visible) refresh(); });
addEventListener('obsSourceActiveChanged',  function(e){ if(!e||!e.detail||e.detail.active)  refresh(); });
document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh(); });

reflect(); applyFlags(); setMetrics();
buildBase(true); applyPalette(); remeasure();

/* webfonts land after first layout: re-measure both the grid and the marquees */
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){ setMetrics(); renderGrid(); remeasure(); });
}
/* marqy is a module and registers <marqy-loop> after this script runs */
if (window.customElements && customElements.whenDefined){
  customElements.whenDefined('marqy-loop').then(remeasure).catch(function(){});
}

poll(); restart();
requestAnimationFrame(loop);
</script>
</body>
