WHAT THIS IS
A self-contained React prototype exploring reply-derived threading for a
Discord-style group chat app (target codebase: colibri.social, packages/client,
atproto-based). Everything is bundled inline: React 19 + lucide-react (esbuild,
minified, in the <script> tag) and Tailwind v4 utilities (generated via
@tailwindcss/cli, in the <style> tag). Opens from file:// with no network.

DO NOT EDIT THE MINIFIED BUNDLE. The canonical, readable source component is
embedded below in <script type="text/plain" id="source-jsx"> (identical to the
sibling artifact file thread-prototype.jsx). Edit that source, then rebuild:

  mkdir -p build/src && cd build
  npm i react react-dom lucide-react esbuild tailwindcss @tailwindcss/cli
  # extract source-jsx block to src/App.jsx, then:
  sed -i "/@import url('https:\/\/fonts.googleapis.com/d" src/App.jsx  # offline: no webfont
  echo 'import { createRoot } from "react-dom/client";
  import App from "./App.jsx";
  createRoot(document.getElementById("root")).render(<App />);' > src/entry.jsx
  printf '@import "tailwindcss";\n@source "./src";\n' > input.css
  npx esbuild src/entry.jsx ——bundle ——minify ——jsx=automatic \
    ——define:process.env.NODE_ENV='"production"' ——outfile=bundle.js
  npx @tailwindcss/cli -i input.css -o tw.css ——minify
  # inline tw.css into <style> and bundle.js into <script> of this HTML shell
  # (escape "</script" as "<\/script" inside the JS before inlining)

ARCHITECTURE (the part that matters)
- One data model rule: every message is { id, author, text, ts, parent }.
  parent is a nullable message id. THERE IS NO THREAD OBJECT. Threads are
  derived at render time by walking each message's parent chain to its root
  (rootOf) and bucketing by root id. Every feature is a different way of
  writing that one field:
    * Discord-style reply        -> parent = replied-to message id
    * posting in focus view      -> parent = focused thread root (replyTo wins)
    * retroactive "move to thread"-> parent = target thread's root id
    * detach                     -> parent = null (descendants follow along
                                    automatically since grouping is derived)
- Three zoom levels: "interwoven" (flat channel, colored 3px rails mark
  multi-message threads), "threaded" (digest: threads sorted by latest
  activity, root + last 3 replies, older replies behind a collapse pill,
  per-thread expanded state in `expanded` Set), and focus view (`focus` state
  holds a root id; header swaps, composer defaults into the thread).
  focusRoot is re-derived through rootOf each render so a merged-away root
  doesn't strand the view.
- Permissions: canMove(m) = modMode || m.author === "You". Maps to a
  MANAGE_MESSAGES-style permission in a real app.
- Colors: all generated in OKLCH from BRAND_HUE = 294 (= #8E51FF,
  oklch(0.601 0.242 294), Tailwind violet-500, colibri's dark ——primary).
  Rails rotate hue by the golden angle (137.5deg) at constant low chroma;
  avatars use the same sequence offset +68deg so avatar hue never equals rail
  hue. Light/dark surface tokens are copied verbatim from colibri.social
  packages/client src/index.css (:root and .dark blocks). Dark mode toggles
  the `dark` state; initial value follows prefers-color-scheme.

OPEN TASK — NOT YET IMPLEMENTED (this is the work item)
Constrain retroactive re-threading by causality, in MoveMenu / attach():
1. ALLOW moving a message into a thread only if the target thread's root is
   OLDER than the message (root.id < message.id, ids are monotonic here; use
   timestamps in a real app). This covers the legitimate forgot-to-reply case.
2. FORBID offering threads whose root is NEWER than the message. A reply must
   not predate its parent: it breaks chronological rendering inside threads,
   parent-before-child pagination assumptions, and notification semantics.
   Crucial for the real target codebase: atproto records are immutable and
   signed, with reply refs fixed at creation — old->new re-parenting cannot
   federate. Filter these targets OUT of the menu (do not show-then-error),
   and leave a code comment explaining why.
3. KEEP thread merging possible: attaching a NEWER root onto an OLDER root is
   causally fine and must remain allowed.
4. OPTIONAL FOLLOW-UP: a "Forward to thread" action covering the forbidden
   direction properly — creates a NEW message ({ author: "You", parent:
   targetRoot, text: quoted excerpt + attribution }) in the target thread and
   leaves the original untouched. Duplication is intentional and honest.
Acceptance: in the seeded data, Sam's "Frankfurt ping..." (id 3) can still be
moved into the "EU servers" thread (root id 1) but must NOT be offered the
"Movie night" thread if its root is newer than the message... check ids at
runtime rather than assuming; seed timestamps/ids are generated. Mia's
"landslide" message must still be movable into "Movie night" (older root).

TESTING WITHOUT A BROWSER
jsdom works: new JSDOM(html, { runScripts: "dangerously", pretendToBeVisual:
true }), dispatch MouseEvent({ bubbles: true }) on buttons, set input values
via the HTMLInputElement prototype setter + input event. See that all
handlers fire and the DOM updates. OKLCH colors need a 2023+ real browser.

<script type="text/plain" id="source-jsx">
import { useState, useRef, useEffect } from "react";
import {
  Hash, Reply, Send, RefreshCw, X, Shield, ShieldCheck,
  FolderInput, Unlink, GitBranch, CornerUpLeft, MessageSquare, ArrowLeft, Sun, Moon
} from "lucide-react";

// ---------- design tokens ----------
// Both palettes lifted from colibri.social packages/client src/index.css
// (:root light block and .dark block). Neutrals are chroma-0 grays; the
// single accent is their --primary violet (#8E51FF = Tailwind violet-500).
const THEMES = {
  light: {
    canvas: "oklch(0.97 0 0)",          // --muted, used as page canvas
    panel: "oklch(1 0 0)",              // --background / --card
    raised: "oklch(1 0 0)",
    ink: "oklch(0.145 0 0)",            // --foreground
    muted: "oklch(0.556 0 0)",          // --muted-foreground
    faint: "oklch(0.708 0 0)",          // --ring
    hairline: "oklch(0.922 0 0)",       // --border
    hairlineStrong: "oklch(0.87 0 0)",
    action: "oklch(0.541 0.281 293)",   // --primary
    chip: "oklch(0.97 0 0)",
    flashNeutral: "oklch(0.95 0 0)",
    shadow: "0 6px 20px rgba(0,0,0,0.10)",
  },
  dark: {
    canvas: "oklch(0.145 0 0)",         // --background
    panel: "oklch(0.205 0 0)",          // --card
    raised: "oklch(0.269 0 0)",         // --muted
    ink: "oklch(0.985 0 0)",            // --foreground
    muted: "oklch(0.708 0 0)",          // --muted-foreground
    faint: "oklch(0.556 0 0)",          // --ring
    hairline: "oklch(1 0 0 / 10%)",     // --border
    hairlineStrong: "oklch(1 0 0 / 18%)",
    action: "oklch(0.606 0.25 292.7)",  // --primary in dark (= #8E51FF)
    chip: "oklch(0.269 0 0)",
    flashNeutral: "oklch(0.31 0 0)",
    shadow: "0 6px 20px rgba(0,0,0,0.45)",
  },
};

// rail colors: derived, not hand-picked. Anchored on #8E51FF, which is
// oklch(0.601 0.242 294) — hue 294 is the only knob. Hues rotate by the
// golden angle; chroma and lightness stay constant per theme so rails
// whisper, not shout. Dark mode lifts rail lightness and deepens tints.
const BRAND_HUE = 294;
const makeRails = (dark) =>
  Array.from({ length: 6 }, (_, i) => {
    const h = ((BRAND_HUE + i * 137.5) % 360).toFixed(0);
    return dark
      ? { rail: `oklch(0.72 0.09 ${h})`, tint: `oklch(0.28 0.035 ${h})`, text: `oklch(0.82 0.07 ${h})` }
      : { rail: `oklch(0.62 0.09 ${h})`, tint: `oklch(0.96 0.018 ${h})`, text: `oklch(0.42 0.09 ${h})` };
  });

// avatar colors from the same generator, offset by half a golden angle so
// no avatar hue coincides with a rail hue (avatar color ≠ thread color)
const makeAvatars = (dark) =>
  Object.fromEntries(
    ["Sam", "Riley", "Jo", "Mia", "You"].map((name, i) => {
      const h = ((BRAND_HUE + 68 + i * 137.5) % 360).toFixed(0);
      return [
        name,
        dark
          ? { bg: `oklch(0.34 0.07 ${h})`, fg: `oklch(0.90 0.05 ${h})` }
          : { bg: `oklch(0.90 0.06 ${h})`, fg: `oklch(0.35 0.10 ${h})` },
      ];
    })
  );

// ---------- seed data ----------
// Deliberately includes two "orphan" messages: on-topic follow-ups that
// were NOT sent as replies (the scenario this prototype exists to fix).
let seedMinute = 3;
let seedId = 1;
const seed = (author, text, parent = null) => {
  seedMinute += 1 + Math.floor(Math.random() * 3);
  return {
    id: seedId++,
    author,
    text,
    parent,
    ts: `2:${String(seedMinute).padStart(2, "0")} PM`,
  };
};

const SEED = (() => {
  const m1 = seed("Sam", "Anyone else seeing lag on the EU servers?");
  const m2 = seed("Riley", "Yeah, since about 1:45", m1.id);
  const m3 = seed("Sam", "Frankfurt ping is over 300ms for me"); // orphan → belongs to m1
  const m4 = seed("Mia", "Movie night poll closes tonight, last call");
  const m5 = seed("Jo", "Restarting the region now, give it 5 min", m2.id);
  const m6 = seed("Jo", "I voted for the heist one, obviously", m4.id);
  const m7 = seed("Sam", "Back to normal for me, thanks Jo", m5.id);
  const m8 = seed("Mia", "Heist movie is winning by a landslide"); // orphan → belongs to m4
  return [m1, m2, m3, m4, m5, m6, m7, m8];
})();

const CANNED = [
  "Agreed, same here",
  "Wait, really?",
  "Can confirm",
  "On it",
  "Good call",
  "Any update on this?",
  "Works for me now",
];
const PEOPLE = ["Sam", "Riley", "Jo", "Mia"];

// ---------- helpers ----------
const excerpt = (s, n = 34) => (s.length > n ? s.slice(0, n) + "…" : s);

export default function ThreadPrototype() {
  const [msgs, setMsgs] = useState(SEED);
  const [view, setView] = useState("interwoven"); // interwoven | threaded
  const [modMode, setModMode] = useState(false);
  const [replyTo, setReplyTo] = useState(null);
  const [menuFor, setMenuFor] = useState(null);
  const [flash, setFlash] = useState(null);
  const [draft, setDraft] = useState("");
  const [expanded, setExpanded] = useState(() => new Set());
  const [focus, setFocus] = useState(null); // rootId of the thread being viewed in isolation
  const [dark, setDark] = useState(() =>
    typeof window !== "undefined" && window.matchMedia
      ? window.matchMedia("(prefers-color-scheme: dark)").matches
      : false
  );
  const T = dark ? THEMES.dark : THEMES.light;
  const RAILS = makeRails(dark);
  const AVATARS = makeAvatars(dark);
  const nextId = useRef(seedId);
  const minute = useRef(seedMinute);
  const feedRef = useRef(null);

  // ---------- derived structure ----------
  const byId = (id) => msgs.find((m) => m.id === id);
  const rootOf = (m) => {
    let cur = m;
    const seen = new Set();
    while (cur.parent && !seen.has(cur.id)) {
      seen.add(cur.id);
      const p = byId(cur.parent);
      if (!p) break;
      cur = p;
    }
    return cur;
  };

  // group messages by thread root, preserving chronological order inside
  const groups = new Map();
  msgs.forEach((m) => {
    const r = rootOf(m).id;
    if (!groups.has(r)) groups.set(r, []);
    groups.get(r).push(m);
  });

  // stable rail assignment: multi-message threads get a color by root id order
  const railFor = new Map();
  [...groups.entries()]
    .filter(([, list]) => list.length > 1)
    .sort((a, b) => a[0] - b[0])
    .forEach(([rootId], i) => railFor.set(rootId, RAILS[i % RAILS.length]));

  const threadName = (rootId) => excerpt(byId(rootId)?.text ?? "thread", 26);

  // re-derive: if the focused message was itself re-threaded, follow it to its new root
  const focusRoot = focus != null && byId(focus) ? rootOf(byId(focus)).id : null;

  // ---------- actions ----------
  const stamp = () => {
    minute.current += 1 + Math.floor(Math.random() * 2);
    return `2:${String(minute.current).padStart(2, "0")} PM`;
  };

  const send = () => {
    const t = draft.trim();
    if (!t) return;
    setMsgs((prev) => [
      ...prev,
      { id: nextId.current++, author: "You", text: t, parent: replyTo ?? focusRoot, ts: stamp() },
    ]);
    setDraft("");
    setReplyTo(null);
  };

  const simulate = () => {
    const pool = focusRoot && groups.has(focusRoot) ? groups.get(focusRoot) : null;
    setMsgs((prev) => {
      const source = pool ?? prev;
      const target = source[Math.floor(Math.random() * source.length)];
      const who = PEOPLE[Math.floor(Math.random() * PEOPLE.length)];
      return [
        ...prev,
        {
          id: nextId.current++,
          author: who,
          text: CANNED[Math.floor(Math.random() * CANNED.length)],
          parent: target.id,
          ts: stamp(),
        },
      ];
    });
  };

  const canMove = (m) => modMode || m.author === "You";

  const attach = (msgId, rootId) => {
    setMsgs((prev) => prev.map((m) => (m.id === msgId ? { ...m, parent: rootId } : m)));
    setExpanded((prev) => new Set(prev).add(rootId));
    setMenuFor(null);
    setFlash(msgId);
  };

  const detach = (msgId) => {
    setMsgs((prev) => prev.map((m) => (m.id === msgId ? { ...m, parent: null } : m)));
    setMenuFor(null);
    setFlash(msgId);
  };

  useEffect(() => {
    if (flash == null) return;
    const t = setTimeout(() => setFlash(null), 1200);
    return () => clearTimeout(t);
  }, [flash]);

  // close move menu on outside click
  useEffect(() => {
    const close = () => setMenuFor(null);
    if (menuFor != null) {
      window.addEventListener("click", close);
      return () => window.removeEventListener("click", close);
    }
  }, [menuFor]);

  // ---------- rendering pieces ----------
  const Avatar = ({ author, size = 30 }) => {
    const a = AVATARS[author];
    return (
      <div
        className="rounded-full flex items-center justify-center flex-shrink-0 font-medium"
        style={{ width: size, height: size, background: a.bg, color: a.fg, fontSize: size * 0.42 }}
      >
        {author[0]}
      </div>
    );
  };

  const MoveMenu = ({ m }) => {
    const currentRoot = rootOf(m).id;
    // causal guard: a message may only join a thread whose root PRECEDES it.
    // Re-parenting into a newer thread would create a reply that predates its
    // parent — that operation is forwarding's job, not re-parenting's.
    const targets = [...groups.keys()].filter((rid) => rid !== currentRoot && rid < m.id);
    const hiddenNewer = [...groups.keys()].filter((rid) => rid !== currentRoot && rid > m.id).length;
    return (
      <div
        onClick={(e) => e.stopPropagation()}
        className="absolute right-0 top-7 z-20 rounded-lg py-1 w-64"
        style={{ background: T.raised, border: `1px solid ${T.hairlineStrong}`, boxShadow: T.shadow }}
      >
        <p className="px-3 py-1.5 text-xs font-medium" style={{ color: T.muted }}>
          Move to thread
        </p>
        {targets.length === 0 && (
          <p className="px-3 py-1.5 text-xs" style={{ color: T.faint }}>
            No other threads yet.
          </p>
        )}
        {targets.map((rid) => {
          const rail = railFor.get(rid);
          return (
            <button
              key={rid}
              onClick={() => attach(m.id, rid)}
              className="menu-item w-full text-left px-3 py-1.5 text-sm flex items-center gap-2"
              style={{ color: T.ink }}
            >
              <span
                className="inline-block rounded-full flex-shrink-0"
                style={{ width: 8, height: 8, background: rail ? rail.rail : T.faint }}
              />
              <span className="truncate">{threadName(rid)}</span>
              <span className="ml-auto text-xs" style={{ color: T.faint }}>
                {groups.get(rid).length}
              </span>
            </button>
          );
        })}
        {m.parent != null && (
          <>
            <div style={{ borderTop: `1px solid ${T.hairline}` }} className="my-1" />
            <button
              onClick={() => detach(m.id)}
              className="menu-item w-full text-left px-3 py-1.5 text-sm flex items-center gap-2"
              style={{ color: T.ink }}
            >
              <Unlink size={14} style={{ color: T.muted }} />
              Detach from thread
            </button>
          </>
        )}
      </div>
    );
  };

  const Actions = ({ m }) => (
    <div className={"msg-actions absolute -top-3 right-1 flex items-center gap-1" + (menuFor === m.id ? " open" : "")}>
      <button
        onClick={(e) => { e.stopPropagation(); setReplyTo(m.id); setMenuFor(null); }}
        title="Reply"
        className="rounded-md p-1"
        style={{ background: T.raised, border: `1px solid ${T.hairlineStrong}`, color: T.muted }}
      >
        <Reply size={14} />
      </button>
      {(groups.get(rootOf(m).id)?.length ?? 0) > 1 && focusRoot == null && (
        <button
          onClick={(e) => { e.stopPropagation(); setFocus(rootOf(m).id); setMenuFor(null); setReplyTo(null); }}
          title="Open thread"
          className="rounded-md p-1"
          style={{ background: T.raised, border: `1px solid ${T.hairlineStrong}`, color: T.muted }}
        >
          <MessageSquare size={14} />
        </button>
      )}
      {canMove(m) && (
        <button
          onClick={(e) => { e.stopPropagation(); setMenuFor(menuFor === m.id ? null : m.id); }}
          title={modMode && m.author !== "You" ? "Move message (moderator)" : "Move message"}
          className="rounded-md p-1"
          style={{
            background: T.raised,
            border: `1px solid ${modMode && m.author !== "You" ? RAILS[0].rail : T.hairlineStrong}`,
            color: modMode && m.author !== "You" ? RAILS[0].text : T.muted,
          }}
        >
          <FolderInput size={14} />
        </button>
      )}
    </div>
  );

  const QuotePreview = ({ m }) => {
    const p = m.parent ? byId(m.parent) : null;
    if (!p) return null;
    return (
      <p className="text-xs mb-0.5 flex items-center gap-1" style={{ color: T.faint }}>
        <CornerUpLeft size={12} />
        <span className="font-medium" style={{ color: T.muted }}>{p.author}</span>
        <span className="truncate">{excerpt(p.text)}</span>
      </p>
    );
  };

  const Message = ({ m, small = false, showQuote = false, rail = null }) => (
    <div
      className="msg relative flex gap-2.5 rounded-md transition-colors duration-500"
      style={{
        padding: "3px 6px",
        background: flash === m.id ? (rail ? rail.tint : T.flashNeutral) : "transparent",
        borderLeft: rail ? `3px solid ${rail.rail}` : "3px solid transparent",
        borderRadius: rail ? 0 : undefined,
      }}
    >
      <Avatar author={m.author} size={small ? 22 : 30} />
      <div className="min-w-0 flex-1" style={{ fontSize: 13.5 }}>
        {showQuote && <QuotePreview m={m} />}
        <span className="font-medium" style={{ color: T.ink }}>{m.author}</span>
        <span className="ml-2 text-xs" style={{ color: T.faint }}>{m.ts}</span>
        <p className="m-0" style={{ color: T.ink, lineHeight: 1.45 }}>{m.text}</p>
      </div>
      <Actions m={m} />
      {menuFor === m.id && <MoveMenu m={m} />}
    </div>
  );

  // threaded view: order threads by latest activity, singletons inline.
  // Long threads collapse to their last VISIBLE_REPLIES messages.
  const VISIBLE_REPLIES = 3;
  const toggleExpand = (rootId) =>
    setExpanded((prev) => {
      const next = new Set(prev);
      next.has(rootId) ? next.delete(rootId) : next.add(rootId);
      return next;
    });

  const threadedBlocks = [...groups.entries()]
    .sort((a, b) => Math.max(...a[1].map((x) => x.id)) - Math.max(...b[1].map((x) => x.id)))
    .map(([rootId, list], i, arr) => {
      const root = byId(rootId);
      const replies = list.filter((m) => m.id !== rootId);
      const rail = railFor.get(rootId) || null;
      const isExpanded = expanded.has(rootId);
      const hiddenCount = !isExpanded && replies.length > VISIBLE_REPLIES
        ? replies.length - VISIBLE_REPLIES
        : 0;
      const hiddenReplies = replies.slice(0, hiddenCount);
      const visibleReplies = replies.slice(hiddenCount);
      const hiddenAuthors = [...new Set(hiddenReplies.map((m) => m.author))].slice(0, 3);
      return (
        <div
          key={rootId}
          style={i < arr.length - 1 ? { borderBottom: `1px solid ${T.hairline}`, paddingBottom: 10 } : undefined}
        >
          {rail && (
            <button
              onClick={() => setFocus(rootId)}
              className="text-xs font-medium mb-1 flex items-center gap-1.5"
              style={{ color: rail.text, background: "transparent", border: "none", padding: 0, cursor: "pointer" }}
              title="Open thread"
            >
              <GitBranch size={12} />
              {threadName(rootId)}
              <span style={{ color: T.faint }}>· {list.length} messages</span>
            </button>
          )}
          <Message m={root} rail={rail} />
          {replies.length > 0 && (
            <div
              className="mt-1 flex flex-col gap-1"
              style={{ marginLeft: 40, borderLeft: `2px solid ${rail ? rail.rail : T.hairlineStrong}`, paddingLeft: 10 }}
            >
              {hiddenCount > 0 && (
                <button
                  onClick={() => toggleExpand(rootId)}
                  className="self-start flex items-center gap-2 rounded-full px-3 py-1 text-xs"
                  style={{
                    background: rail ? rail.tint : T.flashNeutral,
                    color: rail ? rail.text : T.muted,
                    border: `1px solid ${rail ? rail.rail : T.hairlineStrong}`,
                  }}
                >
                  <span className="flex">
                    {hiddenAuthors.map((a, j) => (
                      <span
                        key={a}
                        className="rounded-full flex items-center justify-center font-medium"
                        style={{
                          width: 16,
                          height: 16,
                          fontSize: 9,
                          background: AVATARS[a].bg,
                          color: AVATARS[a].fg,
                          marginLeft: j > 0 ? -5 : 0,
                          border: `1.5px solid ${T.panel}`,
                        }}
                      >
                        {a[0]}
                      </span>
                    ))}
                  </span>
                  {hiddenCount} earlier {hiddenCount === 1 ? "reply" : "replies"}
                </button>
              )}
              {isExpanded && replies.length > VISIBLE_REPLIES && (
                <button
                  onClick={() => toggleExpand(rootId)}
                  className="self-start rounded-full px-3 py-1 text-xs"
                  style={{ color: T.muted, border: `1px solid ${T.hairlineStrong}`, background: T.raised }}
                >
                  Show recent only
                </button>
              )}
              {visibleReplies.map((m) => (
                <Message key={m.id} m={m} small />
              ))}
            </div>
          )}
        </div>
      );
    });

  const replyTarget = replyTo ? byId(replyTo) : null;

  return (
    <div data-theme={dark ? "dark" : "light"} className="min-h-screen w-full flex items-start justify-center py-8 px-4" style={{ background: T.canvas, fontFamily: "'Hanken Grotesk', ui-sans-serif, system-ui, sans-serif" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700&display=swap');
        button { cursor: pointer; font: inherit; }
        .msg .msg-actions { opacity: 0; pointer-events: none; transition: opacity .12s ease; }
        .msg:hover .msg-actions, .msg:focus-within .msg-actions, .msg .msg-actions.open { opacity: 1; pointer-events: auto; }
        @media (hover: none) { .msg .msg-actions { opacity: 1; pointer-events: auto; } }
        .menu-item:hover { background: rgba(32,36,43,0.06); }
        [data-theme="dark"] .menu-item:hover { background: rgba(255,255,255,0.08); }
      `}</style>
      <div className="w-full" style={{ maxWidth: 620 }}>

        {/* header */}
        <div className="flex items-end justify-between mb-4">
          <div>
            <h1 className="m-0 font-medium" style={{ fontSize: 26, color: T.ink, letterSpacing: "-0.02em" }}>
              Loom
            </h1>
            <p className="m-0 text-sm" style={{ color: T.muted }}>
              Reply-derived threads, regroupable after the fact.
            </p>
          </div>
          <div className="flex items-center gap-2">
            <button
              onClick={() => setDark((v) => !v)}
              title={dark ? "Switch to light mode" : "Switch to dark mode"}
              className="flex items-center justify-center rounded-full p-2"
              style={{ background: T.panel, border: `1px solid ${T.hairlineStrong}`, color: T.muted }}
            >
              {dark ? <Sun size={15} /> : <Moon size={15} />}
            </button>
            <button
              onClick={() => setModMode((v) => !v)}
              className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm"
              style={{
                background: modMode ? RAILS[0].tint : T.panel,
                border: `1px solid ${modMode ? RAILS[0].rail : T.hairlineStrong}`,
                color: modMode ? RAILS[0].text : T.muted,
              }}
            >
              {modMode ? <ShieldCheck size={15} /> : <Shield size={15} />}
              {modMode ? "Moderator on" : "Moderator off"}
            </button>
          </div>
        </div>

        {/* view toggle + simulate */}
        <div className="flex items-center justify-between mb-3">
          {focusRoot == null ? (
            <div
              className="flex rounded-full p-0.5"
              style={{ background: T.panel, border: `1px solid ${T.hairlineStrong}` }}
            >
              {["interwoven", "threaded"].map((v) => (
                <button
                  key={v}
                  onClick={() => setView(v)}
                  className="rounded-full px-4 py-1 text-sm capitalize"
                  style={{
                    background: view === v ? T.action : "transparent",
                    color: view === v ? "#FFFFFF" : T.muted,
                  }}
                >
                  {v}
                </button>
              ))}
            </div>
          ) : (
            <span className="text-sm" style={{ color: T.muted }}>Viewing a single thread</span>
          )}
          <button
            onClick={simulate}
            className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm"
            style={{ background: T.panel, border: `1px solid ${T.hairlineStrong}`, color: T.muted }}
          >
            <RefreshCw size={14} />
            Add sample reply
          </button>
        </div>

        {/* channel */}
        <div
          className="rounded-xl"
          style={{ background: T.panel, border: `1px solid ${T.hairline}` }}
        >
          <div
            className="flex items-center gap-2 px-4 py-2.5"
            style={{ borderBottom: `1px solid ${T.hairline}` }}
          >
            {focusRoot != null ? (
              <>
                <button
                  onClick={() => { setFocus(null); setReplyTo(null); }}
                  title="Back to #general"
                  className="flex items-center gap-1 text-sm"
                  style={{ color: T.muted, background: "transparent", border: "none", padding: 0, cursor: "pointer" }}
                >
                  <ArrowLeft size={15} />
                </button>
                <GitBranch size={14} style={{ color: (railFor.get(focusRoot) || RAILS[0]).rail }} />
                <span className="text-sm font-medium truncate" style={{ color: T.ink }}>
                  {threadName(focusRoot)}
                </span>
                <span className="ml-auto text-xs" style={{ color: T.faint }}>
                  {groups.get(focusRoot)?.length ?? 0} messages · in #general
                </span>
              </>
            ) : (
              <>
                <Hash size={15} style={{ color: T.faint }} />
                <span className="text-sm font-medium" style={{ color: T.ink }}>general</span>
                <span className="ml-auto text-xs" style={{ color: T.faint }}>
                  {view === "interwoven"
                    ? "rails mark messages that belong to a thread"
                    : "grouped by thread, newest activity last"}
                </span>
              </>
            )}
          </div>

          <div ref={feedRef} className="px-3 py-3 flex flex-col gap-2" style={{ minHeight: 360 }}>
            {focusRoot != null
              ? (() => {
                  const list = groups.get(focusRoot) ?? [];
                  const root = byId(focusRoot);
                  const rest = list.filter((m) => m.id !== focusRoot);
                  const rail = railFor.get(focusRoot) || null;
                  return (
                    <>
                      <Message m={root} rail={rail} />
                      <div style={{ borderBottom: `1px solid ${T.hairline}`, margin: "2px 0" }} />
                      {rest.map((m) => (
                        <Message key={m.id} m={m} showQuote={m.parent !== focusRoot} />
                      ))}
                      {rest.length === 0 && (
                        <p className="text-sm" style={{ color: T.faint }}>
                          No replies yet. Send a message to start the thread.
                        </p>
                      )}
                    </>
                  );
                })()
              : view === "interwoven"
              ? msgs.map((m) => {
                  const rootId = rootOf(m).id;
                  const rail = groups.get(rootId).length > 1 ? railFor.get(rootId) : null;
                  return <Message key={m.id} m={m} showQuote rail={rail} />;
                })
              : threadedBlocks}
          </div>

          {/* composer */}
          <div className="px-3 pb-3">
            {!replyTarget && focusRoot != null && (
              <div
                className="flex items-center gap-2 rounded-t-lg px-3 py-1.5 text-xs"
                style={{
                  background: (railFor.get(focusRoot) || RAILS[0]).tint,
                  color: (railFor.get(focusRoot) || RAILS[0]).text,
                }}
              >
                <GitBranch size={13} />
                Posting in <span className="font-medium">{threadName(focusRoot)}</span>
              </div>
            )}
            {replyTarget && (
              <div
                className="flex items-center gap-2 rounded-t-lg px-3 py-1.5 text-xs"
                style={{ background: T.chip, color: T.muted }}
              >
                <CornerUpLeft size={13} />
                Replying to <span className="font-medium" style={{ color: T.ink }}>{replyTarget.author}</span>
                <span className="truncate">{excerpt(replyTarget.text)}</span>
                <button onClick={() => setReplyTo(null)} className="ml-auto" style={{ color: T.muted }} title="Cancel reply">
                  <X size={13} />
                </button>
              </div>
            )}
            <div
              className="flex items-center gap-2 px-3"
              style={{
                background: T.raised,
                border: `1px solid ${T.hairlineStrong}`,
                borderRadius: replyTarget || focusRoot != null ? "0 0 10px 10px" : 10,
              }}
            >
              <input
                value={draft}
                onChange={(e) => setDraft(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && send()}
                placeholder={focusRoot != null ? "Reply in thread" : "Message #general"}
                className="flex-1 py-2.5 text-sm outline-none bg-transparent"
                style={{ color: T.ink }}
              />
              <button onClick={send} title="Send" style={{ color: T.action }}>
                <Send size={17} />
              </button>
            </div>
          </div>
        </div>

        {/* hint */}
        <p className="text-xs mt-3" style={{ color: T.muted, lineHeight: 1.6 }}>
          Hover a message for actions. Sam's "Frankfurt ping" and Mia's "landslide" messages
          were sent without replying — flip on moderator mode, hover them, and use the
          folder button to move them into their threads, then compare both views.
        </p>
      </div>
    </div>
  );
}
