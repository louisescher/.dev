<style>

  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1200px;height:675px;transform-origin:center;flex:none}
  #stage > *{position:absolute;left:0;top:0}
  #bg-linear{width:1200px;height:675px;background:linear-gradient(45deg,
    var(--c0) 8.5%, var(--c2) 27.5%, var(--c4) 49%, var(--c3) 72%, var(--c1) 89.5%)}
  body:not(.fluid) #bg-fluid{display:none}
  body.fluid #bg-linear{display:none}
  #cdclip{left:24px;top:24px;width:1152px;height:627px;border-radius:32px;overflow:hidden}
  pre.cd{position:absolute;margin:0;white-space:pre;left:-100.0px;top:249.0px;
    font-family:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
    font-size:12px;line-height:16.1px}
  pre.cd .k1{color:var(--c1)} pre.cd .k2{color:var(--c2)}
  pre.cd .k3{color:var(--c3)} pre.cd .k4{color:var(--c4)}
  #cd-glow{filter:blur(16px)}
  /* headline: query-param text */
  #headline{left:380px;top:24px;width:772px;height:627px;display:flex;
    align-items:center;justify-content:center;text-align:center;pointer-events:none}
  #headline span{font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
    font-weight:700;font-size:72px;line-height:1.05;letter-spacing:-0.02em;
    color:#fff;white-space:pre-line;max-width:100%}
  /* corner symbols */
  .rot{transform-box:fill-box;transform-origin:50% 50%}
  body.anim-squares #sym-squares .rot{animation:rot var(--p) linear infinite var(--d)}
  @keyframes rot{to{transform:rotate(360deg)}}
  #globe-anim{visibility:hidden}
  body.anim-globe #globe-anim{visibility:visible}
  body.anim-globe #globe-static{visibility:hidden}
  #poly-anim{visibility:hidden}
  body.anim-poly #poly-anim{visibility:visible}
  body.anim-poly #poly-static{visibility:hidden}
  @media (prefers-reduced-motion:reduce){
    .rot{animation:none !important}
  }
  /* prototyping panel */
  #panel{position:fixed;top:10px;right:10px;z-index:9;display:flex;flex-direction:column;gap:6px;
    background:rgba(10,15,25,.88);border:1px solid #2a3550;border-radius:8px;padding:10px 12px;
    font:12px/1.4 ui-monospace,monospace;color:#cdd6e4;min-width:210px}
  #panel label{display:flex;align-items:center;gap:10px;justify-content:space-between;cursor:pointer}
  #panel input[type=number]{width:60px;background:#0a0f19;color:#ece7e3;border:1px solid #2a3550;
    border-radius:4px;padding:2px 6px;font:inherit}
  #panel select{background:#0a0f19;color:#ece7e3;border:1px solid #2a3550;border-radius:4px;font:inherit}
  #panel small{color:#5c6a85}
  body.nopanel #panel{display:none}

  let [xi,yi] = toCell(su,sv);
  if (!inGrid(xi,yi)) return -1;
  const blocked = lock ? FROZEN : hubSet;
  if (blocked.has(yi*W+xi)){
    if (!lock) return yi*W+xi;
    let du=su-hu, dv=sv-hv; const n=Math.hypot(du,dv)||1e-9; du/=n; dv/=n;
    for (let s=1;s<40;s++){
      const [x2,y2]=toCell(su+du*0.02*s, sv+dv*0.02*s);
      if (inGrid(x2,y2) && !FROZEN.has(y2*W+x2))
        return grid[y2][x2]!==' ' ? y2*W+x2 : -1;
    }
    return -1;
  }
  if (grid[yi][xi]===' '){
    for (let s=1;s<30;s++){
      const f=1-0.02*s, c2=toCell(su*f, sv*f);
      const ok = !(lock ? FROZEN : hubSet).has(c2[1]*W+c2[0]);
      if (inGrid(c2[0],c2[1]) && grid[c2[1]][c2[0]]!==' ' && ok) return c2[1]*W+c2[0];
    }
    return -1;
  }
  return yi*W+xi;
}
function makeSrc(theta, lock){
  const src = new Int32Array(H*W);
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i=y*W+x; src[i]=i;
    const [u,v]=toUV(x,y), r=Math.hypot(u,v);
    if (r>0.995) continue;
    if (lock && FROZEN.has(i)) continue;          /* hole + bevel pinned */
    if (grid[y][x]===' ' && (lock || r>0.4)) continue;
    const ct=Math.cos(-theta), st=Math.sin(-theta);
    const s = sampleIdx(u*ct-v*st, u*st+v*ct, lock);
    if (s>=0) src[i]=s;
  }
  return src;
}
const N = 24, srcCache = {};
function srcFrames(lock){
  const k = lock?'L':'F';
  if (!srcCache[k]){
    srcCache[k]=[];
    for (let i=0;i<N;i++) srcCache[k].push(makeSrc(2*Math.PI*i/N, lock));
  }
  return srcCache[k];
}
const esc = c => c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':c;
const htmlCache = {};
function frameHTML(fi, lock, paint, pin){
  const key=(lock?'L':'F')+(pin?'P':'-')+paint+fi;
  if (htmlCache[key]) return htmlCache[key];
  const src=srcFrames(lock)[fi];
  let out='';
  for (let y=0;y<H;y++){
    let run='', cls=null;
    const flush=()=>{ if(run){ out+=cls?'<span class="'+cls+'">'+run+'</span>':run; run=''; } };
    for (let x=0;x<W;x++){
      const i=y*W+x, s=src[i];
      let ch=grid[(s/W)|0][s%W];
      if (pin && ch!==' '){
        const sd=DIM[(s/W)|0][s%W]==='1', dd=DIM[y][x]==='1';
        if (!sd && dd) ch=DEMOTE[ch]||ch;
        else if (sd && !dd) ch=PROMOTE[ch]||ch;
      }
      const ks=paint==='travel'?s:i;
      const kd=KOL[(ks/W)|0][ks%W];
      const c=ch===' '?null:PALETTE[kd==='.'?0:+kd];
      if (c!==cls){ flush(); cls=c; }
      run+=esc(ch);
    }
    flush(); out+='\n';
  }
  return htmlCache[key]=out;
}

/* ---- playback + controls ---- */
const main=document.getElementById('cd-main'), glow=document.getElementById('cd-glow');
const ui=id=>document.getElementById(id);
const inOBS=typeof window!=='undefined' && !!window.obsstudio;
const reduced=!inOBS && matchMedia('(prefers-reduced-motion: reduce)').matches;
let fps=12, playing=!reduced, lock=true, paint='fixed', pin=true, fi=0, acc=0, last=null;
if (reduced){ ui('play').checked=false; document.body.className='nopanel';
  ['fluid','sq','gl','po'].forEach(i=>ui(i).checked=false); }

/* ---- settings from query params (override defaults, incl. reduced-motion) ---- */
const Q=new URLSearchParams(location.search);
const qb=(k,cur)=>Q.has(k) ? Q.get(k)!=='0' : cur;
if (Q.has('fps')) fps=Math.min(60,Math.max(1,parseInt(Q.get('fps'),10)||12));
playing=qb('play',playing); lock=qb('lock',lock); pin=qb('pin',pin);
let INTRO=1400; if (Q.has('intro')) INTRO=Math.min(10000,Math.max(0,parseInt(Q.get('intro'),10)||0));
const FADE=500;
let POLYSHOW=0; if (Q.has('polyshow')) POLYSHOW=Math.min(10000,Math.max(0,parseInt(Q.get('polyshow'),10)||0));
let PHASE=0; if (Q.has('phase')) PHASE=Math.min(30000,Math.max(-30000,parseInt(Q.get('phase'),10)||0));
if (Q.get('paint')==='travel') paint='travel'; else if (Q.get('paint')==='fixed') paint='fixed';
const FLAGS={fluid:'fluid', sq:'anim-squares', gl:'anim-globe', po:'anim-poly'};
for (const k in FLAGS){
  const on=qb(k, ui(k).checked);
  ui(k).checked=on; document.body.classList.toggle(FLAGS[k], on);
}
document.body.classList.toggle('nopanel', !qb('panel', false));
ui('play').checked=playing; ui('lock').checked=lock; ui('pin').checked=pin;
ui('paint').value=paint; ui('fps').value=fps; ui('phs').value=PHASE;

const DEFAULTS={fps:'12',play:'1',lock:'1',pin:'1',paint:'fixed',fluid:'1',sq:'1',gl:'1',po:'1',panel:'0',intro:'1400',polyshow:'0',phase:'0'};
function syncURL(){
  const p=new URLSearchParams();
  const t=Q.get('text'); if (t) p.set('text', t);
  const cur={fps:String(fps), play:playing?'1':'0', lock:lock?'1':'0', pin:pin?'1':'0',
    paint, fluid:ui('fluid').checked?'1':'0', sq:ui('sq').checked?'1':'0',
    gl:ui('gl').checked?'1':'0', po:ui('po').checked?'1':'0',
    panel:document.body.classList.contains('nopanel')?'0':'1', intro:String(INTRO), polyshow:String(POLYSHOW), phase:String(PHASE)};
  for (const k in cur) if (cur[k]!==DEFAULTS[k]) p.set(k, cur[k]);
  const qs=p.toString();
  try{ history.replaceState(null,'', qs ? '?'+qs : location.pathname); }catch(e){}
}

function draw(){ const h=frameHTML(fi,lock,paint,pin); main.innerHTML=h; glow.innerHTML=h; }

(function(){  /* monospace advance must equal 7.325px */
  const probe=document.createElement('span');
  probe.style.cssText='position:absolute;visibility:hidden;white-space:pre';
  probe.textContent='0'.repeat(100);
  main.appendChild(probe);
  const adv=probe.getBoundingClientRect().width/100;
  probe.remove();
  const ls=(7.325-adv).toFixed(3)+'px';
  main.style.letterSpacing=ls; glow.style.letterSpacing=ls;
})();
draw();

const stage=document.getElementById('stage');
function fit(){ stage.style.transform='scale('+Math.min(innerWidth/1200,innerHeight/675)+')'; }
addEventListener('resize',fit); fit();

let epoch=null;
function resetPhase(){ epoch=null; }
addEventListener('obsSourceVisibleChanged', e=>{ if (!e || !e.detail || e.detail.visible) resetPhase(); });
if (typeof document.addEventListener==='function')
  document.addEventListener('visibilitychange', ()=>{ if (!document.hidden) resetPhase(); });
function loop(t){
  if (last===null) last=t;
  if (epoch===null) epoch=t;
  const pt=t-epoch;                     /* phase time: 0 at every source activation */
  if (playing){
    acc+=t-last;
    const step=1000/fps;
    while (acc>=step){ acc-=step; fi=(fi+1)%N; draw(); }
  }
  last=t;
  fluidTick(t);
  globeTick(t);
  polyTick(pt);
  requestAnimationFrame(loop);
}
ui('fps').addEventListener('input',e=>{ const v=+e.target.value; if(v>=1&&v<=60) fps=v; syncURL(); });
ui('phs').addEventListener('input',e=>{ const v=parseInt(e.target.value,10); if(!isNaN(v)&&v>=-30000&&v<=30000) PHASE=v; syncURL(); });
ui('play').addEventListener('change',e=>{ playing=e.target.checked; syncURL(); });
ui('lock').addEventListener('change',e=>{ lock=e.target.checked; draw(); syncURL(); });
ui('pin').addEventListener('change',e=>{ pin=e.target.checked; draw(); syncURL(); });
ui('paint').addEventListener('change',e=>{ paint=e.target.value; draw(); syncURL(); });
const tog=(id,c)=>ui(id).addEventListener('change',e=>{ document.body.classList.toggle(c,e.target.checked); syncURL(); });
tog('fluid','fluid'); tog('sq','anim-squares'); tog('gl','anim-globe'); tog('po','anim-poly');
addEventListener('keydown',e=>{ if(e.key==='h'||e.key==='H'){ document.body.classList.toggle('nopanel'); syncURL(); } });

/* ---- globe: meridians sweep left to right (orthographic front arcs) ---- */
const globeG=document.getElementById('globe-anim');
const NM=16, meridians=[];
for (let i=0;i<NM;i++){
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  globeG.appendChild(p); meridians.push(p);
}
function globeTick(t){
  if (!document.body.classList.contains('anim-globe')) return;
  const phi = t*2*Math.PI/14000;
  for (let i=0;i<NM;i++){
    let th = (i*2*Math.PI/NM + phi) % (2*Math.PI);
    if (th > Math.PI) th -= 2*Math.PI;
    if (Math.cos(th) <= 0.02){ meridians[i].setAttribute('d',''); continue; }
    const rx = 48*Math.sin(th);
    const sweep = rx>0 ? 1 : 0;
    const arx = Math.max(Math.abs(rx), 0.4);
    meridians[i].setAttribute('d', 'M1084 68A'+arx.toFixed(2)+' 24 0 0 '+sweep+' 1084 116');
  }
}

/* ---- fluid background: soft roaming vortices + wandering palette injectors ---- */
const fcv=document.getElementById('bg-fluid'), fx=fcv.getContext('2d');
const FLW=192, FLH=108, NPX=FLW*FLH;
const small=document.createElement('canvas'); small.width=FLW; small.height=FLH;
const sctx=small.getContext('2d');
const idata=sctx.createImageData(FLW,FLH);
let F=new Float32Array(NPX*3), G=new Float32Array(NPX*3);
const EDGE=new Float32Array(NPX);
(function init(){
  const STOPS=[[.085,10,15,25],[.275,18,55,103],[.49,29,105,201],[.72,246,162,198],[.895,236,231,227]];
  for (let y=0;y<FLH;y++) for (let x=0;x<FLW;x++){
    const i=y*FLW+x;
    const d=Math.min(Math.max((x/FLW+(1-y/FLH))/2,0),1);
    let c=[STOPS[0][1],STOPS[0][2],STOPS[0][3]];
    if (d>=STOPS[STOPS.length-1][0]) c=[STOPS[4][1],STOPS[4][2],STOPS[4][3]];
    else for (let k=0;k<STOPS.length-1;k++){
      if (d>=STOPS[k][0] && d<=STOPS[k+1][0]){
        const f=(d-STOPS[k][0])/(STOPS[k+1][0]-STOPS[k][0]);
        c=[STOPS[k][1]*(1-f)+STOPS[k+1][1]*f, STOPS[k][2]*(1-f)+STOPS[k+1][2]*f, STOPS[k][3]*(1-f)+STOPS[k+1][3]*f];
      }
    }
    F[i*3]=c[0]; F[i*3+1]=c[1]; F[i*3+2]=c[2];
    EDGE[i]=Math.min(Math.min(x,FLW-1-x)/14, Math.min(y,FLH-1-y)/14, 1);
  }
})();
const INJ=[ /* color, speed, phase, radius, alpha, orbit index */
  [10,15,25,   0.000031, 0.0, 40, .010],
  [10,15,25,   0.000023, 2.1, 44, .009],
  [18,55,103,  0.000027, 4.0, 36, .008],
  [29,105,201, 0.000021, 1.2, 36, .008],
  [246,162,198,0.000035, 3.3, 32, .007],
  [236,231,227,0.000041, 5.1, 24, .006],
];
let fluidGate=false;
function fluidTick(t){
  if (!document.body.classList.contains('fluid')) return;
  fluidGate=!fluidGate; if (fluidGate) return;      /* 30fps is plenty */
  const w=t*0.00010;
  const vor=[[96+80*Math.sin(w),        54+38*Math.cos(w*1.31),   40, 3.2],
             [96+80*Math.cos(w*0.77),   54+38*Math.sin(w*1.09),   46,-3.4],
             [96+64*Math.sin(w*0.53+2), 54+30*Math.cos(w*0.87+1), 34, 2.7]];
  for (let y=0;y<FLH;y++) for (let x=0;x<FLW;x++){
    const i=y*FLW+x;
    let vx=0, vy=0;
    for (const [cx,cy,R,s] of vor){
      const dx=x-cx, dy=y-cy;
      const k=s*Math.exp(-(dx*dx+dy*dy)/(R*R))*0.05;
      vx+=-dy*k; vy+=dx*k;
    }
    let px=x-vx*EDGE[i], py=y-vy*EDGE[i];
    px=Math.min(Math.max(px,0),FLW-1.001); py=Math.min(Math.max(py,0),FLH-1.001);
    const x0=px|0, y0=py|0, fxr=px-x0, fyr=py-y0;
    const i00=(y0*FLW+x0)*3, i10=i00+3, i01=i00+FLW*3, i11=i01+3;
    for (let ch=0;ch<3;ch++){
      G[i*3+ch]=F[i00+ch]*(1-fxr)*(1-fyr)+F[i10+ch]*fxr*(1-fyr)+
                F[i01+ch]*(1-fxr)*fyr+F[i11+ch]*fxr*fyr;
    }
  }
  const tmp=F; F=G; G=tmp;
  for (let n=0;n<INJ.length;n++){
    const [r,g,b,sp,ph,R,al]=INJ[n];
    const cx=96+(84-6*n)*Math.sin(t*sp*6.28+ph);
    const cy=54+(40-3*n)*Math.cos(t*sp*6.28*1.27+ph*1.7);
    const x0=Math.max(0,(cx-2.2*R)|0), x1=Math.min(FLW-1,(cx+2.2*R)|0);
    const y0=Math.max(0,(cy-2.2*R)|0), y1=Math.min(FLH-1,(cy+2.2*R)|0);
    for (let y=y0;y<=y1;y++) for (let x=x0;x<=x1;x++){
      const dx=x-cx, dy=y-cy;
      const gq=Math.exp(-(dx*dx+dy*dy)/(R*R))*al;
      const i3=(y*FLW+x)*3;
      F[i3]  =F[i3]  *(1-gq)+r*gq;
      F[i3+1]=F[i3+1]*(1-gq)+g*gq;
      F[i3+2]=F[i3+2]*(1-gq)+b*gq;
    }
  }
  const D=idata.data;
  for (let i=0;i<NPX;i++){
    D[i*4]=F[i*3]; D[i*4+1]=F[i*3+1]; D[i*4+2]=F[i*3+2]; D[i*4+3]=255;
  }
  sctx.putImageData(idata,0,0);
  fx.imageSmoothingEnabled=true; fx.imageSmoothingQuality='high';
  fx.filter='contrast(1.12) saturate(1.06)';
  fx.drawImage(small,0,0,1200,675);
  fx.filter='none';
}

/* ---- polyhedron: dice roll-in intro, then true 3D tumble ---- */
const polyG=document.getElementById('poly-anim');
const rollG=document.getElementById('poly-roll');
const ICO=(()=>{
  const P=(1+Math.sqrt(5))/2, raw=[];
  for (const s1 of [1,-1]) for (const s2 of [1,-1]){
    raw.push([0, s1, s2*P]); raw.push([s1, s2*P, 0]); raw.push([s2*P, 0, s1]);
  }
  const n=Math.hypot(1,P);
  const V=raw.map(p=>p.map(c=>c/n));
  let dmin=1e9;
  const dist=(i,j)=>Math.hypot(V[i][0]-V[j][0],V[i][1]-V[j][1],V[i][2]-V[j][2]);
  for (let i=0;i<12;i++) for (let j=i+1;j<12;j++) dmin=Math.min(dmin,dist(i,j));
  const E=[], Fc=[];
  for (let i=0;i<12;i++) for (let j=i+1;j<12;j++) if (dist(i,j)<dmin*1.01) E.push([i,j]);
  for (let i=0;i<12;i++) for (let j=i+1;j<12;j++) for (let k=j+1;k<12;k++)
    if (dist(i,j)<dmin*1.01 && dist(j,k)<dmin*1.01 && dist(i,k)<dmin*1.01) Fc.push([i,j,k]);
  return {V, E, F:Fc};
})();
const polyLines=ICO.E.map(()=>{
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  polyG.appendChild(l); return l;
});
const rollFaces=ICO.F.map(()=>{
  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('stroke','url(#paint7_radial_6_3)');
  p.setAttribute('stroke-width','1.5');
  p.setAttribute('stroke-linejoin','round');
  rollG.appendChild(p); return p;
});
const PCX=1108, PCY=538, PR=36.5;

/* rotation helpers */
const ambP = t => ambM(t + PHASE);   /* poly clock with calibration offset */
function ambM(t){
  const a=t*2*Math.PI/26000, b=t*2*Math.PI/17000;
  const ca=Math.cos(a), sa=Math.sin(a), cb=Math.cos(b), sb=Math.sin(b);
  return [cb,0,sb, sa*sb,ca,-sa*cb, -ca*sb,sa,ca*cb];   /* Rx(a)Ry(b) */
}
function axisRot(w, ang){
  const [x,y,z]=w, c=Math.cos(ang), s=Math.sin(ang), C=1-c;
  return [c+x*x*C, x*y*C-z*s, x*z*C+y*s,
          y*x*C+z*s, c+y*y*C, y*z*C-x*s,
          z*x*C-y*s, z*y*C+x*s, c+z*z*C];
}
const mul3=(A,B)=>{
  const R=new Array(9);
  for (let r=0;r<3;r++) for (let c=0;c<3;c++)
    R[r*3+c]=A[r*3]*B[c]+A[r*3+1]*B[3+c]+A[r*3+2]*B[6+c];
  return R;
};
const apply3=(M,v)=>[M[0]*v[0]+M[1]*v[1]+M[2]*v[2],
                     M[3]*v[0]+M[4]*v[1]+M[5]*v[2],
                     M[6]*v[0]+M[7]*v[1]+M[8]*v[2]];
const ROLLAXIS=(()=>{ const w=[0.30,0.50,-0.81], n=Math.hypot(...w); return w.map(c=>c/n); })();
const PAL={dark:[10,15,25], blue:[29,105,201], pink:[246,162,198]};
const mix=(a,b,f)=>a.map((v,i)=>Math.round(v*(1-f)+b[i]*f));
const rgb=c=>'rgb('+c[0]+','+c[1]+','+c[2]+')';
const easeOutCubic=u=>1-Math.pow(1-u,3);

function drawSolid(M, cx, cy, fillO){
  /* project, painter-sort faces back to front, lambert shade */
  const pts=ICO.V.map(v=>{ const p=apply3(M,v); return [cx+PR*p[0], cy+PR*p[1], p[2]]; });
  const world=ICO.V.map(v=>apply3(M,v));
  const order=ICO.F.map((f,i)=>{
    const zc=(world[f[0]][2]+world[f[1]][2]+world[f[2]][2])/3;
    return [zc,i];
  }).sort((a,b)=>a[0]-b[0]);
  const L=[-0.35,-0.5,0.79];
  for (let k=0;k<order.length;k++){
    const [zc,fi]=order[k], [i,j,m]=ICO.F[fi], el=rollFaces[k];
    const a=world[i], b=world[j], c=world[m];
    let nx=(b[1]-a[1])*(c[2]-a[2])-(b[2]-a[2])*(c[1]-a[1]);
    let ny=(b[2]-a[2])*(c[0]-a[0])-(b[0]-a[0])*(c[2]-a[2]);
    let nz=(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
    const cen=[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3,(a[2]+b[2]+c[2])/3];
    if (nx*cen[0]+ny*cen[1]+nz*cen[2]<0){ nx=-nx; ny=-ny; nz=-nz; }
    const nn=Math.hypot(nx,ny,nz);
    const l=Math.max(0,(nx*L[0]+ny*L[1]+nz*L[2])/nn);
    let col=mix(PAL.dark, PAL.blue, Math.min(1,l*1.15));
    if (l>0.82) col=mix(col, PAL.pink, (l-0.82)/0.18*0.65);
    el.setAttribute('d','M'+pts[i][0].toFixed(2)+' '+pts[i][1].toFixed(2)+
      'L'+pts[j][0].toFixed(2)+' '+pts[j][1].toFixed(2)+
      'L'+pts[m][0].toFixed(2)+' '+pts[m][1].toFixed(2)+'Z');
    el.setAttribute('fill', rgb(col));
    el.setAttribute('fill-opacity',(0.96*fillO).toFixed(3));
    el.setAttribute('stroke-opacity',
      (fillO + (1-fillO)*(0.42+0.58*(zc/2+0.5))).toFixed(3));
  }
}
function drawWire(t){
  const M=ambP(t);
  const pts=ICO.V.map(v=>{ const p=apply3(M,v); return [PCX+PR*p[0], PCY+PR*p[1], p[2]]; });
  for (let k=0;k<ICO.E.length;k++){
    const [i,j]=ICO.E[k], p=pts[i], q=pts[j], l=polyLines[k];
    l.setAttribute('x1',p[0].toFixed(2)); l.setAttribute('y1',p[1].toFixed(2));
    l.setAttribute('x2',q[0].toFixed(2)); l.setAttribute('y2',q[1].toFixed(2));
    l.setAttribute('stroke-opacity',(0.42+0.58*((p[2]+q[2])/4+0.5)).toFixed(3));
  }
}
function polyTick(t){
  if (!document.body.classList.contains('anim-poly')){ rollG.style.visibility='hidden'; return; }
  if (t < POLYSHOW){ rollG.style.visibility='hidden'; polyG.style.visibility='hidden'; return; }
  const rolling = !reduced && INTRO>0 && t < INTRO+FADE;
  rollG.style.visibility = rolling ? 'visible' : 'hidden';
  polyG.style.visibility = rolling && t < INTRO ? 'hidden' : '';
  if (!rolling){ drawWire(t); return; }
  if (t < INTRO){
    /* dice roll: travel with ease-out, decaying bounces, spin coupled to distance */
    const u=Math.min(1, t/INTRO), e=easeOutCubic(u);
    const x=-80+(PCX+80)*e;
    const y=PCY-120*Math.pow(1-u,1.7)*Math.abs(Math.sin(3*Math.PI*u));
    const M=mul3(axisRot(ROLLAXIS,(PCX-x)/PR), ambP(INTRO));
    drawSolid(M, x, y, 1);
  } else {
    /* in place: keep tumbling on the ambient clock while faces fade */
    const fu=Math.min(1,(t-INTRO)/FADE);
    drawSolid(ambP(t), PCX, PCY, 1-fu);
    drawWire(t);           /* wireframe underneath takes over seamlessly */
  }
}

requestAnimationFrame(loop);
</script>
